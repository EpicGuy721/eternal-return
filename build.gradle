plugins {
	// "fabric-loom-remap" is the Loom variant for obfuscated Minecraft versions such as 1.21.1.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

sourceSets {
	// In-game tests (Fabric GameTest). A separate test mod that is never packed into the release jar.
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"eternalreturn" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"eternalreturn-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	// Headless test servers. The gametest mod's TestServerMixin reads the eternalreturn.gametest.*
	// properties: which world preset to use, which test batches to run, and worldgen config overrides.
	runs {
		gametest {
			server()
			name "Game Test (flat world)"
			source sourceSets.gametest
			runDir "build/gametest/flat"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${file("build/gametest/flat/report.xml")}"
		}
		gametestModernerBeta {
			server()
			name "Game Test (Moderner Beta 1.6.4 amplified, debug tunnel on)"
			source sourceSets.gametest
			runDir "build/gametest/moderner_beta"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${file("build/gametest/moderner_beta/report.xml")}"
			vmArg "-Deternalreturn.gametest.preset=eternalreturn_test:moderner_beta_1_6_4_amplified"
			vmArg "-Deternalreturn.gametest.batches=worldgen"
			vmArg "-Deternalreturn.gametest.debugTunnel=true"
		}
		gametestModernerBetaTunnelOff {
			server()
			name "Game Test (Moderner Beta 1.6.4 amplified, debug tunnel off)"
			source sourceSets.gametest
			runDir "build/gametest/moderner_beta_off"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${file("build/gametest/moderner_beta_off/report.xml")}"
			vmArg "-Deternalreturn.gametest.preset=eternalreturn_test:moderner_beta_1_6_4_amplified"
			vmArg "-Deternalreturn.gametest.batches=worldgen"
			vmArg "-Deternalreturn.gametest.debugTunnel=false"
		}
		gametestVanilla {
			server()
			name "Game Test (vanilla generator, debug tunnel on)"
			source sourceSets.gametest
			runDir "build/gametest/vanilla"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${file("build/gametest/vanilla/report.xml")}"
			vmArg "-Deternalreturn.gametest.preset=minecraft:normal"
			vmArg "-Deternalreturn.gametest.batches=worldgen"
			vmArg "-Deternalreturn.gametest.debugTunnel=true"
		}
	}
}

// Every test run starts from a fresh world, so chunks generated by an earlier run can't leak in.
tasks.register("cleanGametestRuns", Delete) {
	delete layout.buildDirectory.dir("gametest")
}
tasks.matching { it.name.startsWith("runGametest") }.configureEach {
	dependsOn "cleanGametestRuns"
}
// "build" compiles the tests (so they can't silently break) but doesn't run them; runAllGametests does.
tasks.named("check") {
	dependsOn "compileGametestJava"
}
tasks.register("runAllGametests") {
	group = "verification"
	description = "Runs every game test suite: the flat-world suites and the worldgen checks."
	dependsOn "runGametest", "runGametestModernerBeta", "runGametestModernerBetaTunnelOff", "runGametestVanilla"
}

repositories {
	// Modrinth's Maven, only for Moderner Beta below.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Dev runs only (runClient, runServer, tests): the worldgen this mod is built to sit on top of.
	// Not on the compile classpath, and not a dependency of the released jar.
	modLocalRuntime "maven.modrinth:moderner-beta:${project.moderner_beta_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
